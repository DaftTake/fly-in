<!DOCTYPE html>

		<script src="ThirdParty/jquery-1.5.2.min.js"></script>
		<script src="ThirdParty/jquery-ui-1.8.11.custom.min.js"></script>

		<script type="text/javascript" src="AnimationLibrary/UndoFunctions.js"> </script>
		<script type="text/javascript" src="AnimationLibrary/AnimatedObject.js"> </script>

		<script type="text/javascript" src="AlgorithmLibrary/FlyIn.js"> </script>
				
		<script>
			var currentAlg;
			function init()
			{
				var animManag = initCanvas();
				currentAlg = new FlyIn(animManag, canvas.width, canvas.height);
			}
		</script>

	<body onload="init();" class="VisualizationMainPage">

			</div>

				<div id="algoControlSection">
					<table id="AlgorithmSpecificControls"> </table> 
				</div>
				
				<!-- Increased canvas height to allow room for the distance tables -->				
				<canvas id="canvas" width="1100" height="800"></canvas>
				
				<div id="generalAnimationControlSection">
					<table id="GeneralAnimationControls">  </table>		
				</div>
				
			</div> <!-- mainContent -->
			
			<div id="footer">  
				<p>Fly-In Algorithm on USFCA Galles Engine</p>
			</div>

		</div><!-- container -->
